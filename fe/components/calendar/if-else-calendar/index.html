<!-- Календарь с логикой выделения промежутка дат в css -->
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>:nth-child of</title>
    <link rel="stylesheet" href="setting.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calendar">
      <div class="calendar__heading">
        <p class="calendar__month">Декабрь 2025</p>
      </div>
      <table class="calendar__table">
        <thead class="calendar__weekdays">
          <tr>
            <th scope="col">Пн</th>
            <th scope="col">Вт</th>
            <th scope="col">Ср</th>
            <th scope="col">Чт</th>
            <th scope="col">Пт</th>
            <th scope="col">Сб</th>
            <th scope="col">Вс</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="day day-now" style="--day: 1">1</td>
            <td class="day day-now" style="--day: 2">2</td>
            <td class="day day-now" style="--day: 3">3</td>
            <td class="day day-now" style="--day: 4">4</td>
            <td class="day day-now" style="--day: 5">5</td>
            <td class="day day-now" style="--day: 6">6</td>
            <td class="day day-now" style="--day: 7">7</td>
          </tr>
          <tr>
            <td class="day day-now" style="--day: 8">8</td>
            <td class="day day-now" style="--day: 9">9</td>
            <td class="day day-now" style="--day: 10">10</td>
            <td class="day day-now" style="--day: 11">11</td>
            <td class="day day-now" style="--day: 12">12</td>
            <td class="day day-now" style="--day: 13">13</td>
            <td class="day day-now" style="--day: 14">14</td>
          </tr>
          <tr>
            <td class="day day-now" style="--day: 15">15</td>
            <td class="day day-now" style="--day: 16">16</td>
            <td class="day day-now" style="--day: 17">17</td>
            <td class="day day-now" style="--day: 18">18</td>
            <td class="day day-now" style="--day: 19">19</td>
            <td class="day day-now" style="--day: 20">20</td>
            <td class="day day-now" style="--day: 21">21</td>
          </tr>
          <tr>
            <td class="day day-now" style="--day: 22">22</td>
            <td class="day day-now" style="--day: 23">23</td>
            <td class="day day-now" style="--day: 24">24</td>
            <td class="day day-now" style="--day: 25">25</td>
            <td class="day day-now" style="--day: 26">26</td>
            <td class="day day-now" style="--day: 27">27</td>
            <td class="day day-now" style="--day: 28">28</td>
          </tr>
          <tr>
            <td class="day day-now" style="--day: 29">29</td>
            <td class="day day-now" style="--day: 30">30</td>
            <td class="day day-now" style="--day: 31">31</td>
            <td class="day day-next" style="--day: 1">1</td>
            <td class="day day-next" style="--day: 2">2</td>
            <td class="day day-next" style="--day: 3">3</td>
            <td class="day day-next" style="--day: 4">4</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
